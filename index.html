  <body>
   <div id="root"></div>
<script>
  window.addEventListener('error', function (e) {
    showErr(e.error ? (e.error.stack || e.error.message) : e.message);
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr(e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : 'Unknown promise rejection');
  });
  function showErr(text) {
    var box = document.createElement('pre');
    box.style.cssText = 'position:fixed;inset:0;margin:0;padding:16px;background:#fff0e1;color:#983f64;font:12px monospace;white-space:pre-wrap;overflow:auto;z-index:99999;';
    box.textContent = 'App error:\n\n' + text;
    document.body.appendChild(box);
  }
</script>
<script type="module" src="/src/main.tsx"></script>
